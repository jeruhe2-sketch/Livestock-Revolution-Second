name: Fetch ASF Email Alerts

on:
  workflow_dispatch: {}  # cron-job.org가 GitHub API로 이 트리거만 호출함

permissions:
  contents: write  # 기본 GITHUB_TOKEN에 커밋 푸시 권한 부여

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install google-auth-oauthlib google-api-python-client

      - name: ASF 이메일 알림 수집
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python3 scripts/fetch_asf_email_alerts.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/asf_alerts.json
          git diff --quiet --cached || git commit -m "chore: ASF 이메일 알림 갱신 [자동]"
          git pull --rebase origin main
          git push
