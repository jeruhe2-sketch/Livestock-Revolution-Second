name: Fetch ASF Email Alerts

on:
  schedule:
    # 30분마다 실행 (UTC 기준 cron 표기; 필요시 주기 조정)
    - cron: "*/30 * * * *"
  workflow_dispatch: {}  # 수동 실행 버튼도 활성화 (테스트용)

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install google-auth-oauthlib google-api-python-client

      - name: ASF 이메일 알림 수집
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python3 scripts/fetch_asf_email_alerts.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/asf_alerts.json
          git diff --quiet --cached || git commit -m "chore: ASF 이메일 알림 갱신 [자동]"
          git push
