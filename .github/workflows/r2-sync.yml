name: R2 Sync Tool

# Claude가 GitHub API로 이 워크플로우를 원격 실행시켜서
# 이 세션 자체는 접근 못 하는 Cloudflare R2 API를 대신 호출하게 하는 중계 워크플로우.
on:
  workflow_dispatch:
    inputs:
      action:
        description: '실행할 작업'
        required: true
        type: choice
        options:
          - list-all       # 버킷 전체 오브젝트 목록을 JSON으로 저장
          - list-folder    # 특정 폴더(prefix) 목록만 저장
          - upload-pending # _pending_upload/ 안의 파일들을 R2에 업로드 후 정리
          - delete-pending # _pending_delete.json에 나열된 키들을 R2에서 삭제
          - rename-files   # rename-map.json 기준으로 R2 오브젝트 이름 변경(copy+delete)
          - set-cors       # cors-config.json을 버킷에 적용 (브라우저 fetch 다운로드 허용)
          - compress-images # 버킷 전체 사진 리사이즈/재압축 (경로/이름 유지)
          - setup-analytics # Cloudflare Web Analytics 사이트 등록 (jeruhe2-sketch.github.io 방문자 통계)
          - fix-orientation # EXIF 회전 정보가 있는 사진을 실제 픽셀 회전으로 반영(눕거나 뒤집힌 채 뜨는 문제 해결)
          - verify-images  # 버킷 전체 사진이 정상적으로 열리는지 무결성 검증
          - generate-thumbs # 그리드 표시용 작은 썸네일(400px) 생성해서 thumbs/ 에 업로드
        default: list-all
      prefix:
        description: 'list-folder일 때 사용할 폴더 경로 (예: "37 57 높이 17 수퍼 돈전지 3pc/")'
        required: false
        default: ''

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: AWS CLI로 R2(S3 호환) 접근 설정
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [r2]
          aws_access_key_id = ${{ secrets.R2_ACCESS_KEY_ID }}
          aws_secret_access_key = ${{ secrets.R2_SECRET_ACCESS_KEY }}
          EOF

      - name: 버킷 전체 목록 조회
        if: ${{ github.event.inputs.action == 'list-all' }}
        run: |
          aws s3api list-objects-v2 \
            --bucket livestock-library \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --profile r2 \
            --output json > r2-inventory.json
          echo "총 오브젝트 개수:"
          python3 -c "import json; d=json.load(open('r2-inventory.json')); print(len(d.get('Contents', [])))"

      - name: 특정 폴더 목록 조회
        if: ${{ github.event.inputs.action == 'list-folder' }}
        run: |
          aws s3api list-objects-v2 \
            --bucket livestock-library \
            --prefix "${{ github.event.inputs.prefix }}" \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --profile r2 \
            --output json > r2-inventory.json

      - name: 대기 중인 파일 R2 업로드
        if: ${{ github.event.inputs.action == 'upload-pending' }}
        run: |
          if [ -d "_pending_upload" ]; then
            aws s3 cp "_pending_upload/" "s3://livestock-library/" \
              --recursive \
              --endpoint-url ${{ secrets.R2_ENDPOINT }} \
              --profile r2
            rm -rf "_pending_upload"
          else
            echo "업로드 대기 파일 없음"
          fi
          aws s3api list-objects-v2 \
            --bucket livestock-library \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --profile r2 \
            --output json > r2-inventory.json

      - name: _pending_delete.json에 나열된 오브젝트 R2에서 삭제
        if: ${{ github.event.inputs.action == 'delete-pending' }}
        run: |
          if [ -f "_pending_delete.json" ]; then
            python3 scripts/delete_r2.py
            rm -f "_pending_delete.json"
          else
            echo "삭제 대기 목록(_pending_delete.json) 없음"
          fi
          aws s3api list-objects-v2 \
            --bucket livestock-library \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --profile r2 \
            --output json > r2-inventory.json
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: R2 오브젝트 이름 변경 (rename-map.json 기준)
        if: ${{ github.event.inputs.action == 'rename-files' }}
        run: |
          python3 scripts/rename_r2.py
          aws s3api list-objects-v2 \
            --bucket livestock-library \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --profile r2 \
            --output json > r2-inventory.json
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: R2 버킷 CORS 설정 (Cloudflare REST API)
        if: ${{ github.event.inputs.action == 'set-cors' }}
        run: |
          echo "=== PUT 요청 결과 ===" > cors-result.json
          curl -s -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/r2/buckets/livestock-library/cors" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "rules": [
                {
                  "allowed": {
                    "origins": ["*"],
                    "methods": ["GET", "HEAD"]
                  }
                }
              ]
            }' >> cors-result.json
          echo "" >> cors-result.json
          echo "=== 확인용 GET 결과 ===" >> cors-result.json
          curl -s "https://api.cloudflare.com/client/v4/accounts/${{ secrets.CF_ACCOUNT_ID }}/r2/buckets/livestock-library/cors" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" >> cors-result.json
          echo "" >> cors-result.json
          echo "=== 실제 오브젝트 응답 헤더 (Origin 헤더 넣어서 요청) ===" >> cors-result.json
          TESTURL="https://pub-4a7975ff76ef42ed80c2fcfed0ae169e.r2.dev/SEARA/%EC%A0%84%EC%A7%80/SEARA_%EC%A0%84%EC%A7%80_HLCUIT1251021138_1.jpg"
          echo "테스트 URL: $TESTURL" >> cors-result.json
          curl -s -I -H "Origin: https://jeruhe2-sketch.github.io" "$TESTURL" >> cors-result.json
          cat cors-result.json

      - name: Cloudflare Web Analytics 사이트 등록
        if: ${{ github.event.inputs.action == 'setup-analytics' }}
        run: |
          pip install requests --quiet
          python3 scripts/setup_cf_analytics.py "jeruhe2-sketch.github.io"
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}

      - name: 분석 스니펫을 아티팩트로 업로드
        if: ${{ github.event.inputs.action == 'setup-analytics' }}
        uses: actions/upload-artifact@v4
        with:
          name: cf-analytics-snippet
          path: cf_analytics_snippet_*.html
          retention-days: 7

      - name: Pillow 설치
        if: ${{ github.event.inputs.action == 'compress-images' || github.event.inputs.action == 'verify-images' || github.event.inputs.action == 'generate-thumbs' || github.event.inputs.action == 'fix-orientation' }}
        run: pip install Pillow --quiet

      - name: EXIF 회전 정보 픽셀 반영 (사진 눕힘/뒤집힘 보정)
        if: ${{ github.event.inputs.action == 'fix-orientation' }}
        run: |
          python3 scripts/fix_orientation_r2.py
          aws s3api list-objects-v2 \
            --bucket livestock-library \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --profile r2 \
            --output json > r2-inventory.json
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: 버킷 이미지 전체 무결성 검증
        if: ${{ github.event.inputs.action == 'verify-images' }}
        run: python3 scripts/verify_r2.py
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: 썸네일 생성 및 업로드
        if: ${{ github.event.inputs.action == 'generate-thumbs' }}
        run: |
          python3 scripts/generate_thumbs_r2.py
          aws s3api list-objects-v2 \
            --bucket livestock-library \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --profile r2 \
            --output json > r2-inventory.json
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: 버킷 이미지 전체 압축/리사이즈
        if: ${{ github.event.inputs.action == 'compress-images' }}
        run: |
          python3 scripts/compress_r2.py
          aws s3api list-objects-v2 \
            --bucket livestock-library \
            --endpoint-url ${{ secrets.R2_ENDPOINT }} \
            --profile r2 \
            --output json > r2-inventory.json
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}

      - name: 결과 커밋
        run: |
          git config user.name "R2 Sync Bot"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "R2 동기화 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
