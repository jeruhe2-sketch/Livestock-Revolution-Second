<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>축산 라이브러리</title>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#A8431F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="축산라이브러리">
<meta name="format-detection" content="telephone=no">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg: #EFF3F1;
    --ink: #16201C;
    --sub: #5C6B64;
    --line: #D3DCD7;
    --accent: #A8431F;
    --cold: #33586B;
    --card: #FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:ui-monospace, 'SF Mono', monospace; }

  header{
    padding: 24px 20px;
    padding-top: max(24px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(239,243,241,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 10;
  }
  .brand-row{ display:flex; align-items:baseline; gap:10px; }
  .brand-row h1{ font-size: 20px; font-weight: 800; margin:0; cursor:pointer; }
  .brand-row span{ font-size: 11px; color: var(--sub); font-family:ui-monospace,monospace; }

  .breadcrumb{
    margin-top: 10px;
    font-size: 13px;
    color: var(--sub);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .breadcrumb .crumb{ cursor:pointer; color: var(--cold); }
  .breadcrumb .crumb:hover{ text-decoration: underline; }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    cursor: pointer;
    font-size: 12.5px;
    color: var(--ink);
    font-weight: 600;
  }
  .back-btn:hover{ border-color: var(--cold); color: var(--cold); }

  .photo-wrap{ position: relative; flex-shrink:0; }
  .download-btn{
    position:absolute;
    bottom: 8px;
    right: 8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(22,32,28,0.75);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .download-btn:hover{ background: var(--accent); }
  .download-all-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top: 12px;
    padding: 9px 14px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--card);
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
  }
  .download-all-btn:hover{ border-color: var(--accent); color: var(--accent); }
  .download-all-btn.secondary{ background: transparent; }
  .action-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .action-row .download-all-btn{ margin-top: 12px; }

  main{ padding: 16px 20px 60px; max-width: 1000px; margin: 0 auto; }

  /* 브랜드 목록 */
  .brand-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .brand-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    font-weight: 700;
    font-size: 15px;
  }
  .brand-card:hover{ border-color: var(--accent); color: var(--accent); }
  .brand-card .count{
    display:block;
    font-size: 11px;
    color: var(--sub);
    font-weight: 400;
    margin-top: 4px;
    font-family: ui-monospace,monospace;
  }

  /* 부위 목록 */
  .part-list{ margin-top: 16px; display:flex; flex-direction:column; gap:10px; }
  .part-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    display:flex;
    justify-content: space-between;
    align-items:center;
  }
  .part-card:hover{ border-color: var(--accent); }
  .part-card .name{ font-weight: 700; font-size: 15px; }
  .part-card .photo-count{ font-size: 12px; color: var(--sub); font-family: ui-monospace,monospace; }

  /* 상세 화면 */
  .detail-info{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-top: 16px;
  }
  .detail-info .row{
    display:flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 13.5px;
  }
  .detail-info .row:last-child{ border-bottom:none; }
  .detail-info .row .k{ color: var(--sub); }
  .detail-info .row .v{ font-weight: 600; font-family: ui-monospace,monospace; text-align:right; }

  .photo-grid{
    margin-top: 16px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .photo-wrap img{
    width: 100%;
    height: 150px;
    object-fit: cover;
    display:block;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    cursor: zoom-in;
  }

  .empty-state{ text-align:center; padding: 60px 20px; color: var(--sub); }

  /* 라이트박스 */
  .lightbox{
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10,14,12,0.94);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition: opacity .18s ease;
    touch-action: none;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox img{
    max-width: 92vw; max-height: 78vh;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    user-select:none;
    -webkit-user-drag:none;
    touch-action: none;
  }
  .lightbox-close{
    position:absolute; top:max(14px, env(safe-area-inset-top)); right:14px;
    width:44px; height:44px; border-radius:50%;
    background: rgba(255,255,255,0.12); border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:#fff;
  }
  .lightbox-close:hover{ background: var(--accent); }
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%);
    width:44px; height:44px; border-radius:50%;
    background: rgba(255,255,255,0.12); border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:#fff;
  }
  .lightbox-nav:hover{ background: var(--accent); }
  .lightbox-nav.prev{ left:14px; }
  .lightbox-nav.next{ right:14px; }
  .lightbox-counter{
    position:absolute; bottom:max(18px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    color: rgba(255,255,255,0.75); font-size:12.5px;
    font-family: ui-monospace,monospace;
    background: rgba(255,255,255,0.1);
    padding: 5px 12px; border-radius: 20px;
  }
  .lightbox-download{
    position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); right:14px;
    width:44px; height:44px; border-radius:50%;
    background: rgba(255,255,255,0.12); border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:#fff;
  }
  .lightbox-download:hover{ background: var(--accent); }
  .lightbox-download.loading svg{ animation: spin .8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .toast{
    position: fixed; bottom: 24px; left:50%; transform: translateX(-50%);
    background: var(--ink); color:#fff; font-size:13px;
    padding: 10px 18px; border-radius: 24px;
    opacity:0; pointer-events:none; transition: opacity .2s ease;
    z-index: 200;
    max-width: 88vw; text-align:center;
  }
  .toast.show{ opacity:1; }

  /* 모바일 */
  @media (max-width: 640px){
    header{ padding: 16px 14px; }
    .brand-row h1{ font-size: 17px; }
    main{ padding: 12px 14px 40px; }
    .brand-grid{ grid-template-columns: repeat(auto-fill, minmax(105px, 1fr)); gap:8px; }
    .brand-card{ padding: 14px 8px; font-size: 13.5px; }
    .part-card{ padding: 12px 14px; }
    .photo-grid{ grid-template-columns: repeat(3, 1fr); gap:6px; }
    .photo-wrap img{ height: 108px; border-radius: 7px; }
    .download-btn{ width: 26px; height: 26px; bottom:5px; right:5px; }
    .download-btn svg{ width:12px; height:12px; }
    .action-row{ flex-direction: column; }
    .download-all-btn{ width:100%; justify-content:center; padding: 13px; }
    .detail-info{ padding: 14px; }
    .lightbox-nav{ width:40px; height:40px; }
    .lightbox-nav.prev{ left:6px; }
    .lightbox-nav.next{ right:6px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand-row" onclick="goHome()">
    <h1>축산 라이브러리</h1>
    <span>PHOTO ARCHIVE</span>
  </div>
  <div class="breadcrumb" id="breadcrumb"></div>
</header>

<main id="main"></main>

<div class="lightbox" id="lightbox" onclick="handleLightboxClick(event)">
  <button class="lightbox-close" onclick="closeLightbox(event)" title="닫기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <button class="lightbox-nav prev" onclick="lightboxNav(event,-1)" title="이전">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <img id="lightbox-img" src="" alt="">
  <button class="lightbox-nav next" onclick="lightboxNav(event,1)" title="다음">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M9 18l6-6-6-6"/></svg>
  </button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
  <button class="lightbox-download" id="lightbox-dl-btn" onclick="lightboxDownload(event)" title="다운로드">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
  let MANIFEST = {};
  let state = { brand: null, part: null };

  async function loadData(){
    try {
      MANIFEST = await fetch('data/manifest.json?v=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
    } catch(e) {
      console.error('로드 실패', e);
      MANIFEST = {};
    }
    applyHash();
    render();
  }

  function updateHash(){
    if (state.brand && state.part){
      history.replaceState(null, '', `#${encodeURIComponent(state.brand)}/${encodeURIComponent(state.part)}`);
    } else if (state.brand){
      history.replaceState(null, '', `#${encodeURIComponent(state.brand)}`);
    } else {
      history.replaceState(null, '', location.pathname + location.search);
    }
  }

  function applyHash(){
    const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!hash) return;
    const [b, p] = hash.split('/');
    if (b && MANIFEST[b]){
      state.brand = b;
      if (p && MANIFEST[b][p]) state.part = p;
    }
  }

  function goHome(){ state = { brand: null, part: null }; updateHash(); render(); }
  function goBrand(b){ state = { brand: b, part: null }; updateHash(); render(); }
  function goPart(b, p){ state = { brand: b, part: p }; updateHash(); render(); }

  function goBack(){
    if (state.part){ state.part = null; }
    else if (state.brand){ state.brand = null; }
    updateHash();
    render();
  }

  function renderBreadcrumb(){
    const bc = document.getElementById('breadcrumb');
    let html = '';
    if (state.brand){
      html += `<span class="back-btn" onclick="goBack()">← 뒤로</span>`;
    }
    html += `<span class="crumb" onclick="goHome()">전체</span>`;
    if (state.brand){
      html += ` / <span class="crumb" onclick="goBrand('${state.brand}')">${state.brand}</span>`;
    }
    if (state.part){
      const displayName = MANIFEST[state.brand][state.part].displayName;
      html += ` / <span>${displayName}</span>`;
    }
    bc.innerHTML = html;
  }

  function render(){
    renderBreadcrumb();
    const main = document.getElementById('main');
    const brands = Object.keys(MANIFEST);

    if (brands.length === 0){
      main.innerHTML = `<div class="empty-state">아직 등록된 사진이 없습니다</div>`;
      return;
    }

    // 1단계: 브랜드 목록
    if (!state.brand){
      main.innerHTML = `<div class="brand-grid">` + brands.map(b => {
        const partCount = Object.keys(MANIFEST[b]).length;
        return `<div class="brand-card" onclick="goBrand('${b}')">${b}<span class="count">${partCount}개 부위</span></div>`;
      }).join('') + `</div>`;
      return;
    }

    // 2단계: 부위 목록
    if (state.brand && !state.part){
      const parts = MANIFEST[state.brand];
      main.innerHTML = `<div class="part-list">` + Object.keys(parts).map(p => {
        const obj = parts[p];
        return `<div class="part-card" onclick="goPart('${state.brand}','${p}')">
          <span class="name">${obj.displayName}</span>
          <span class="photo-count">사진 ${obj.photos.length}장</span>
        </div>`;
      }).join('') + `</div>`;
      return;
    }

    // 3단계: 상세 (사진 + 정보)
    const obj = MANIFEST[state.brand][state.part];
    const photoHtml = obj.photos.map((url, i) => `
      <div class="photo-wrap">
        <img src="${url}" loading="lazy" onclick="openLightbox(${i})">
        <button class="download-btn" onclick="downloadPhoto('${url}', ${i}, this)" title="다운로드">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
        </button>
      </div>
    `).join('');
    const infoHtml = Object.entries(obj.info).map(([k,v]) => `
      <div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>
    `).join('');

    main.innerHTML = `
      <div class="photo-grid">${photoHtml}</div>
      <div class="action-row">
        <button class="download-all-btn secondary" onclick="copyPageLink(this)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          현재 페이지 링크 복사
        </button>
        <button class="download-all-btn" onclick="downloadAll()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
          전체 ${obj.photos.length}장 다운로드
        </button>
      </div>
      <div class="detail-info">${infoHtml}</div>
    `;
  }

  let lightboxIndex = 0;

  function openLightbox(i){
    lightboxIndex = i;
    renderLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(e){
    if(e) e.stopPropagation();
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function handleLightboxClick(e){
    // 이미지나 버튼이 아닌 배경 클릭 시 닫기
    if (e.target.id === 'lightbox'){ closeLightbox(e); }
  }

  function lightboxNav(e, dir){
    e.stopPropagation();
    const photos = MANIFEST[state.brand][state.part].photos;
    lightboxIndex = (lightboxIndex + dir + photos.length) % photos.length;
    renderLightbox();
  }

  function renderLightbox(){
    const photos = MANIFEST[state.brand][state.part].photos;
    document.getElementById('lightbox-img').src = photos[lightboxIndex];
    document.getElementById('lightbox-counter').textContent = `${lightboxIndex+1} / ${photos.length}`;
  }

  function lightboxDownload(e){
    e.stopPropagation();
    const photos = MANIFEST[state.brand][state.part].photos;
    downloadPhoto(photos[lightboxIndex], lightboxIndex, document.getElementById('lightbox-dl-btn'));
  }

  // 클립보드 복사 (구형 브라우저/HTTP 환경 대비 fallback 포함)
  async function copyToClipboard(text){
    try {
      if (navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch(e) { /* fallback으로 진행 */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch(e) {
      return false;
    }
  }

  async function copyPageLink(btnEl){
    const ok = await copyToClipboard(location.href);
    if (ok){
      showToast('링크가 복사됐습니다.');
      if (btnEl){
        btnEl.classList.add('copied');
        setTimeout(() => btnEl.classList.remove('copied'), 1200);
      }
    } else {
      showToast('복사에 실패했어요. 주소창을 직접 복사해주세요.');
    }
  }

  document.addEventListener('keydown', (e) => {
    const lb = document.getElementById('lightbox');
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lightboxNav(e, -1);
    if (e.key === 'ArrowRight') lightboxNav(e, 1);
  });

  // 스와이프 (모바일)
  let touchStartX = 0, touchStartY = 0;
  const lbEl = document.getElementById('lightbox');
  lbEl.addEventListener('touchstart', (e) => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  lbEl.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      lightboxNav(e, dx < 0 ? 1 : -1);
    }
  }, { passive: true });

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    const duration = Math.max(2200, Math.min(msg.length * 70, 6000));
    t._timer = setTimeout(() => t.classList.remove('show'), duration);
  }

  // R2 등 외부 도메인 사진은 <a download>가 무시되고 그냥 열리기만 하므로
  // fetch로 받아 blob URL을 만들어 강제로 다운로드시킨다.
  // 캐시된 옛 응답(CORS 헤더 없음)을 피하기 위해 캐시 우회 쿼리를 붙여서 요청한다.
  async function fetchAsBlob(url, retries = 1){
    const bustUrl = url + (url.includes('?') ? '&' : '?') + '_dl=' + Date.now() + Math.random().toString(36).slice(2);
    for (let attempt = 0; attempt <= retries; attempt++){
      try {
        const res = await fetch(bustUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error('fetch 실패: ' + res.status);
        return await res.blob();
      } catch(e) {
        if (attempt === retries) throw e;
        await new Promise(r => setTimeout(r, 500));
      }
    }
  }

  function triggerBlobDownload(blob, url){
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    const originalName = decodeURIComponent(url.split('/').pop().split('?')[0]);
    const dot = originalName.lastIndexOf('.');
    const base = dot > -1 ? originalName.slice(0, dot) : originalName;
    const extPart = dot > -1 ? originalName.slice(dot) : '';
    a.download = `${base}_${Date.now()}${extPart}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
  }

  // 단일 사진 다운로드 (버튼 직접 클릭 시 - 실패하면 새 탭으로 폴백)
  async function downloadPhoto(url, i, btnEl){
    if (btnEl) btnEl.classList.add('loading');
    try {
      const blob = await fetchAsBlob(url, 1);
      triggerBlobDownload(blob, url);
    } catch(e) {
      console.error('다운로드 실패', e);
      window.open(url, '_blank');
      showToast('직접 다운로드가 안 돼서 새 탭에 열었어요. 길게 눌러 저장해주세요.');
    } finally {
      if (btnEl) btnEl.classList.remove('loading');
    }
  }

  // 전체 다운로드 (배치 중엔 새 탭을 띄우지 않고, 끝나고 실패 목록만 안내)
  async function downloadAll(){
    const obj = MANIFEST[state.brand][state.part];
    showToast(`${obj.photos.length}장 다운로드를 시작합니다`);
    const failed = [];
    for (let i = 0; i < obj.photos.length; i++){
      try {
        const blob = await fetchAsBlob(obj.photos[i], 1);
        triggerBlobDownload(blob, obj.photos[i]);
      } catch(e) {
        console.error('배치 다운로드 실패', obj.photos[i], e);
        failed.push(i + 1);
      }
      await new Promise(r => setTimeout(r, 450));
    }
    if (failed.length === 0){
      showToast(`${obj.photos.length}장 전부 다운로드 완료`);
    } else {
      showToast(`${obj.photos.length - failed.length}장 성공, ${failed.length}장 실패(${failed.join(',')}번). 실패한 사진은 개별 다운로드 버튼으로 다시 받아주세요.`);
    }
  }

  loadData();
</script>
