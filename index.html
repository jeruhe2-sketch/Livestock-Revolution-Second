<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>축산 라이브러리</title>

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/favicon-16.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<meta name="theme-color" content="#A8431F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="축산라이브러리">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://pub-4a7975ff76ef42ed80c2fcfed0ae169e.r2.dev" crossorigin>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg: #EFF3F1;
    --ink: #16201C;
    --sub: #5C6B64;
    --line: #D3DCD7;
    --accent: #A8431F;
    --cold: #33586B;
    --card: #FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  button{ -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  button:active{ transform: scale(0.94); }
  .select-card:active{ transform: scale(0.97); }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:ui-monospace, 'SF Mono', monospace; }

  header{
    padding: 24px 20px;
    padding-top: max(24px, env(safe-area-inset-top));
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: rgba(239,243,241,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 10;
  }
  .brand-row{ display:flex; align-items:baseline; gap:10px; cursor:pointer; }
  .brand-row h1{ font-size: 20px; font-weight: 800; margin:0; }
  .brand-row span{ font-size: 11px; color: var(--sub); font-family:ui-monospace,monospace; }

  .chip-row{
    display:flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  #brand-chips{
    max-height: 92px;
    overflow-y: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  #brand-chips::-webkit-scrollbar{ display:none; }
  .chip{
    flex-shrink:0;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    background: var(--card);
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    white-space: nowrap;
  }
  .chip .n{ color: var(--sub); font-weight:400; margin-left:4px; font-size:11px; }
  .chip.active{ background: var(--accent); border-color: var(--accent); color:#fff; }
  .chip.active .n{ color: rgba(255,255,255,0.75); }
  .part-chip-row{ margin-top: 8px; }
  .part-chip-row .chip.active{ background: var(--cold); border-color: var(--cold); }
  .part-chip-row.hidden{ display:none; }

  .breadcrumb{
    margin-top: 10px;
    font-size: 13px;
    color: var(--sub);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .breadcrumb .crumb{ cursor:pointer; color: var(--cold); }
  .breadcrumb .crumb:hover{ text-decoration: underline; }

  /* 층 구분용 브레드크럼 (main 영역 최상단) */
  .page-breadcrumb{
    display:flex;
    align-items:center;
    flex-wrap: wrap;
    gap: 8px;
    font-size: 13px;
    color: var(--sub);
    margin-bottom: 14px;
  }
  .page-breadcrumb .crumb{ cursor:pointer; color: var(--cold); font-weight:600; }
  .page-breadcrumb .crumb:hover{ text-decoration: underline; }
  .page-breadcrumb .sep{ color: var(--line); }
  .page-breadcrumb .current{ font-weight:800; color: var(--ink); }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    cursor: pointer;
    font-size: 12.5px;
    color: var(--ink);
    font-weight: 600;
  }
  .back-btn:hover{ border-color: var(--cold); color: var(--cold); }

  .photo-wrap{ position: relative; flex-shrink:0; }
  .download-btn{
    position:absolute;
    bottom: 8px;
    right: 8px;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: rgba(22,32,28,0.75);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .download-btn:hover{ background: var(--accent); }
  .download-all-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top: 12px;
    padding: 9px 14px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: var(--card);
    cursor: pointer;
    font-weight: 700;
    font-size: 13px;
    color: var(--ink);
  }
  .download-all-btn:hover{ border-color: var(--accent); color: var(--accent); }
  .download-all-btn.secondary{ background: transparent; }
  .action-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .action-row .download-all-btn{ margin-top: 12px; }

  main{ padding: 16px 20px 60px; max-width: 1000px; margin: 0 auto; }
  .header-inner{ max-width: 1000px; margin: 0 auto; }

  /* 브랜드/부위 선택 카드 (층 구분 화면 공용) */
  .select-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .select-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
  }
  .select-card:hover{ border-color: var(--accent); box-shadow: 0 6px 18px rgba(22,32,28,0.07); transform: translateY(-2px); }
  .select-card.disabled{ cursor: default; opacity: 0.5; }
  .select-card.disabled:hover{ border-color: var(--line); box-shadow: none; transform: none; }
  .chip.disabled{ cursor: default; opacity: 0.45; }
  .chip.disabled:hover{ border-color: var(--line); }
  .select-card .thumb{
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: linear-gradient(90deg, var(--line) 25%, #e4e9e5 37%, var(--line) 63%);
    background-size: 400px 100%;
    animation: shimmer 1.3s ease-in-out infinite;
    overflow: hidden;
  }
  .select-card .thumb.loaded{ animation: none; background: var(--bg); }
  .select-card .thumb img{
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .select-card .thumb img.loaded{ opacity: 1; }
  .select-card .thumb .badge{
    position: absolute;
    bottom: 6px; right: 6px;
    background: rgba(10,14,12,0.62);
    color: #fff;
    font-size: 10.5px;
    font-family: ui-monospace,monospace;
    padding: 3px 8px;
    border-radius: 20px;
  }
  .select-card .body{ padding: 10px 12px 12px; }
  .select-card .name{ font-weight: 800; font-size: 15px; line-height:1.3; }
  .select-card .sub{
    font-size: 11.5px;
    color: var(--sub);
    margin-top: 3px;
    font-family: ui-monospace,monospace;
  }

  @keyframes shimmer{
    0%{ background-position: -200px 0; }
    100%{ background-position: 200px 0; }
  }
  .skeleton-card{
    height: 74px;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--line) 25%, #e4e9e5 37%, var(--line) 63%);
    background-size: 400px 100%;
    animation: shimmer 1.3s ease-in-out infinite;
  }
  .skeleton-thumb{
    background: linear-gradient(90deg, var(--line) 25%, #e4e9e5 37%, var(--line) 63%);
    background-size: 400px 100%;
    animation: shimmer 1.3s ease-in-out infinite;
    border-radius: 10px;
  }

  /* 상세 화면 */
  .detail-info{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-top: 16px;
  }
  .detail-info .row{
    display:flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 13.5px;
  }
  .detail-info .row:last-child{ border-bottom:none; }
  .detail-info .row .k{ color: var(--sub); }
  .detail-info .row .v{ font-weight: 600; font-family: ui-monospace,monospace; text-align:right; }

  .photo-grid{
    margin-top: 16px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 10px;
  }
  .photo-wrap img{
    width: 100%;
    height: 150px;
    object-fit: cover;
    display:block;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    cursor: zoom-in;
    opacity: 0;
    transition: opacity .25s ease;
  }
  .photo-wrap.loaded{ animation: none; background: none; }
  .photo-wrap.loaded img{ opacity: 1; }

  .empty-state{ text-align:center; padding: 60px 20px; color: var(--sub); }

  /* 배치(ERP) 섹션 — 부위 안에서 자재명/BL/EST/등급 단위로 구분 */
  .batch-section{
    margin-top: 22px;
    padding-top: 18px;
    border-top: 2px solid var(--line);
  }
  .batch-section:first-of-type{ margin-top: 16px; border-top: none; padding-top: 0; }
  .batch-header{
    display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    margin-bottom: 4px;
  }
  .batch-title{ font-size: 15px; font-weight: 800; color: var(--ink); }
  .batch-bl{
    font-size: 12px; font-family: ui-monospace,monospace; color: var(--sub);
    background: var(--card); border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 7px;
  }
  .detail-info.batch-info{ margin-top: 10px; padding: 12px 16px; }

  .sample-badge{
    display:inline-block;
    font-size: 12.5px; font-weight: 700; color: var(--cold);
    background: rgba(51,88,107,0.10);
    border: 1px solid var(--cold);
    border-radius: 999px;
    padding: 4px 12px;
    margin-top: 14px;
  }

  /* 라이트박스 */
  .lightbox{
    position: fixed; inset: 0; z-index: 100;
    background: rgba(10,14,12,0.94);
    opacity:0; pointer-events:none;
    transition: opacity .18s ease;
  }
  .lightbox.open{ opacity:1; pointer-events:auto; }
  .lightbox-stage{
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    cursor: grab;
  }
  .lightbox-stage.dragging{ cursor: grabbing; }
  .lightbox-stage img{
    max-width: 94vw; max-height: 82vh;
    border-radius: 6px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    user-select:none;
    -webkit-user-drag:none;
    touch-action: none;
    will-change: transform;
  }
  .lightbox-close{
    position:absolute; top:max(14px, env(safe-area-inset-top)); right:14px;
    width:44px; height:44px; border-radius:50%;
    background: rgba(255,255,255,0.12); border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:#fff;
    z-index: 2;
  }
  .lightbox-close:hover{ background: var(--accent); }
  .lightbox-counter{
    position:absolute; bottom:max(18px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    color: rgba(255,255,255,0.75); font-size:12.5px;
    font-family: ui-monospace,monospace;
    background: rgba(255,255,255,0.1);
    padding: 5px 12px; border-radius: 20px;
    pointer-events:none;
    z-index: 2;
  }
  .lightbox-download{
    position:absolute; bottom:max(14px, env(safe-area-inset-bottom)); right:14px;
    width:44px; height:44px; border-radius:50%;
    background: rgba(255,255,255,0.12); border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:#fff;
    z-index: 2;
  }
  .lightbox-download:hover{ background: var(--accent); }
  .lightbox-download.loading svg{ animation: spin .8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  /* 좌우 넘기기 버튼 (지마켓 상품 이미지처럼: 스크롤/드래그 대신 버튼으로 넘김)
     모바일은 원래 터치 스와이프로 넘기므로, 버튼은 마우스/트랙패드가 있는 웹 환경에서만 노출 */
  /* 주의: top:50%+transform:translateY(-50%) 조합은 클릭 히트테스트가 어긋나는 경우가 있어
     transform 대신 negative margin으로 중앙 정렬한다 */
  .lightbox-nav{
    display: none;
    position:absolute; top:50%; margin-top:-24px;
    width:48px; height:48px; border-radius:50%;
    background: rgba(255,255,255,0.14); border:none;
    align-items:center; justify-content:center;
    cursor:pointer; color:#fff;
    z-index: 2;
    transition: background .12s ease, opacity .12s ease;
  }
  @media (hover: hover) and (pointer: fine){
    .lightbox-nav{ display: flex; }
  }
  .lightbox-nav:hover{ background: var(--accent); }
  .lightbox-nav.disabled{ opacity: 0.25; pointer-events: none; }
  .lightbox-prev{ left: 14px; }
  .lightbox-next{ right: 14px; }
  @media (min-width: 1024px){
    .lightbox-nav{ width: 54px; height: 54px; margin-top: -27px; }
    .lightbox-prev{ left: 24px; }
    .lightbox-next{ right: 24px; }
  }


  .toast{
    position: fixed; bottom: 24px; left:50%; transform: translateX(-50%);
    background: var(--ink); color:#fff; font-size:13px;
    padding: 10px 18px; border-radius: 24px;
    opacity:0; pointer-events:none; transition: opacity .2s ease;
    z-index: 200;
    max-width: 88vw; text-align:center;
  }
  .toast.show{ opacity:1; }

  /* 화면 전환 애니메이션 (지원 브라우저에서만 동작, 미지원시 그냥 즉시 전환) */
  ::view-transition-old(root){
    animation: fade-slide-out .16s ease both;
  }
  ::view-transition-new(root){
    animation: fade-slide-in .18s ease both;
  }
  @keyframes fade-slide-out{
    to{ opacity:0; transform: translateX(-8px); }
  }
  @keyframes fade-slide-in{
    from{ opacity:0; transform: translateX(8px); }
  }

  /* 모바일 */
  @media (max-width: 640px){
    header{ padding: 16px 14px; }
    .brand-row h1{ font-size: 17px; }
    main{ padding: 12px 14px 40px; }
    .select-grid{ grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .select-card .name{ font-size: 13.5px; }
    .select-card .sub{ font-size: 10.5px; }
    .select-card .body{ padding: 8px 10px 10px; }
    .page-breadcrumb{ font-size: 12px; margin-bottom: 10px; }
    .photo-grid{ grid-template-columns: repeat(3, 1fr); gap:6px; }
    .photo-wrap img{ height: 108px; border-radius: 7px; }
    .download-btn{ width: 26px; height: 26px; bottom:5px; right:5px; }
    .download-btn svg{ width:12px; height:12px; }
    .action-row{ flex-direction: column; }
    .download-all-btn{ width:100%; justify-content:center; padding: 13px; }
    .detail-info{ padding: 14px; }
  }

  /* 넓은 데스크톱: 여백/카드 크기를 화면에 맞게 확장 */
  @media (min-width: 1024px){
    main{ max-width: 1160px; padding: 24px 32px 72px; }
    .header-inner{ max-width: 1160px; }
    header{ padding: 22px 32px; }
    .select-grid{ grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 18px; }
    .photo-grid{ grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .photo-wrap img{ height: 190px; border-radius: 12px; }
    .chip{ padding: 8px 16px; font-size: 13.5px; }
    .chip:hover{ border-color: var(--cold); }
  }

  /* 아주 넓은 화면(대형 모니터)에서 카드가 과도하게 커지지 않도록 */
  @media (min-width: 1440px){
    main{ max-width: 1320px; }
    .header-inner{ max-width: 1320px; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-row" onclick="goHome()">
      <h1>축산 라이브러리</h1>
      <span>PHOTO ARCHIVE</span>
    </div>
    <div class="chip-row" id="species-chips"></div>
    <div class="chip-row hidden" id="brand-chips">
      <div class="skeleton-card" style="width:70px;height:30px;border-radius:20px;flex-shrink:0;"></div>
      <div class="skeleton-card" style="width:90px;height:30px;border-radius:20px;flex-shrink:0;"></div>
      <div class="skeleton-card" style="width:60px;height:30px;border-radius:20px;flex-shrink:0;"></div>
    </div>
    <div class="chip-row part-chip-row hidden" id="part-chips"></div>
  </div>
</header>

<main id="main"></main>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()" title="닫기">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
  <div class="lightbox-stage" id="lightbox-stage" onclick="if(event.target.tagName !== 'IMG') closeLightbox()">
    <img id="lightbox-img" data-scale="1" data-tx="0" data-ty="0" alt="" draggable="false" decoding="async">
  </div>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev-btn" onclick="event.stopPropagation(); lightboxNav(-1)" title="이전 사진">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="lightbox-nav lightbox-next" id="lightbox-next-btn" onclick="event.stopPropagation(); lightboxNav(1)" title="다음 사진">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
  </button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
  <button class="lightbox-download" id="lightbox-dl-btn" onclick="lightboxDownload(event)" title="다운로드">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
  let MANIFEST = {};
  const SPECIES_LIST = ['돈육','우육','계육'];

  // 원본 URL(예: https://.../r2.dev/AGROSUPER/전지/xxx.png)을
  // 썸네일 URL(https://.../r2.dev/thumbs/AGROSUPER/전지/xxx.jpg)로 변환
  function toThumbUrl(url){
    const marker = 'r2.dev/';
    const idx = url.indexOf(marker);
    if (idx === -1) return url;
    const head = url.slice(0, idx + marker.length);
    let rest = url.slice(idx + marker.length);
    const qIdx = rest.indexOf('?');
    const query = qIdx > -1 ? rest.slice(qIdx) : '';
    if (qIdx > -1) rest = rest.slice(0, qIdx);
    const dot = rest.lastIndexOf('.');
    const withoutExt = dot > -1 ? rest.slice(0, dot) : rest;
    return `${head}thumbs/${withoutExt}.jpg${query}`;
  }
  let state = { species: null, brand: null, part: null, est: null, grade: null };

  function speciesBrands(sp){ return MANIFEST[sp] || {}; }
  function speciesBrandCount(sp){ return Object.keys(speciesBrands(sp)).length; }
  function speciesPhotoCount(sp){
    return Object.values(speciesBrands(sp)).reduce((sum, parts) =>
      sum + Object.values(parts).reduce((s2, part) => s2 + part.photos.length, 0), 0);
  }
  function speciesThumbUrl(sp){
    const brands = speciesBrands(sp);
    for (const b of Object.keys(brands)){
      for (const p of Object.keys(brands[b])){
        if (brands[b][p].photos && brands[b][p].photos.length) return toThumbUrl(brands[b][p].photos[0]);
      }
    }
    return '';
  }

  // 브랜드 카드용: 부위 개수/전체 사진 장수/대표 썸네일
  function brandPhotoCount(sp, b){
    return Object.values(MANIFEST[sp][b]).reduce((sum, part) => sum + part.photos.length, 0);
  }
  function brandThumbUrl(sp, b){
    const parts = MANIFEST[sp][b];
    for (const p of Object.keys(parts)){
      if (parts[p].photos && parts[p].photos.length) return toThumbUrl(parts[p].photos[0]);
    }
    return '';
  }
  function partThumbUrl(sp, b, p){
    const photos = MANIFEST[sp][b][p].photos;
    return (photos && photos.length) ? toThumbUrl(photos[0]) : '';
  }
  // 카드/그리드 썸네일 공통 마크업 (로딩 스켈레톤 -> 페이드인)
  function thumbHtml(url, badgeText){
    const img = url
      ? `<img src="${url}" loading="lazy" onload="this.classList.add('loaded'); this.parentElement.classList.add('loaded')" onerror="this.parentElement.classList.add('loaded')">`
      : '';
    return `<div class="thumb skeleton-thumb">${img}<span class="badge">${badgeText}</span></div>`;
  }

  // 현재 선택된 부위 객체 (없으면 null)
  function getObj(){
    if (!(state.species && state.brand && state.part)) return null;
    const sp = MANIFEST[state.species];
    const br = sp && sp[state.brand];
    return (br && br[state.part]) || null;
  }

  async function loadData(){
    try {
      MANIFEST = await fetch('data/manifest.json?v=' + Date.now(), { cache: 'no-store' }).then(r => r.json());
    } catch(e) {
      console.error('로드 실패', e);
      MANIFEST = {};
    }
    applyStateFromHash();
    // 첫 진입 상태를 히스토리 맨 앞에 기록해둔다 (뒤로가기의 최종 종착점)
    history.replaceState({ ...state }, '', location.hash || location.pathname + location.search);
    render();
  }

  function emptyState(){ return { species: null, brand: null, part: null, est: null, grade: null }; }

  function applyStateFromHash(){
    const hash = decodeURIComponent(location.hash.replace(/^#/, ''));
    if (!hash){ state = emptyState(); return; }
    const [sp, b, p, est, grade] = hash.split('/');
    if (sp && MANIFEST[sp]){
      state.species = sp;
      state.brand = (b && MANIFEST[sp][b]) ? b : null;
      state.part = (state.brand && p && MANIFEST[sp][state.brand][p]) ? p : null;
      state.est = state.part ? (est || null) : null;
      state.grade = state.part ? (grade || null) : null;
    } else {
      state = emptyState();
    }
  }

  // 화면 전환할 때마다 히스토리에 새 항목을 쌓는다 -> 하드웨어/제스처 뒤로가기가 앱 안에서 동작하게 됨
  function pushState(){
    const segs = [state.species, state.brand, state.part, state.est, state.grade];
    while (segs.length && !segs[segs.length - 1]) segs.pop();
    const hash = segs.length ? `#${segs.map(encodeURIComponent).join('/')}` : (location.pathname + location.search);
    history.pushState({ ...state }, '', hash);
  }

  window.addEventListener('popstate', (e) => {
    const lb = document.getElementById('lightbox');
    if (lb.classList.contains('open')) closeLightbox();
    if (e.state){
      state = { species: e.state.species || null, brand: e.state.brand || null, part: e.state.part || null, est: e.state.est || null, grade: e.state.grade || null };
    } else {
      applyStateFromHash();
    }
    render();
  });

  function goHome(){ state = emptyState(); pushState(); render(); }
  function goSpecies(sp){ state = { species: sp, brand: null, part: null, est: null, grade: null }; pushState(); render(); }
  function goBrand(sp, b){ state = { species: sp, brand: b, part: null, est: null, grade: null }; pushState(); render(); }
  function goPart(sp, b, p){ state = { species: sp, brand: b, part: p, est: null, grade: null }; pushState(); render(); }
  function goEst(sp, b, p, est){ state = { species: sp, brand: b, part: p, est: est, grade: null }; pushState(); render(); }
  function goGrade(sp, b, p, est, grade){ state = { species: sp, brand: b, part: p, est: est, grade: grade }; pushState(); render(); }

  // 브레드크럼의 "뒤로" 버튼은 실제 브라우저 히스토리를 한 칸 되돌린다
  // (popstate 리스너가 상태 복원과 렌더링을 처리)
  function goBack(){
    history.back();
  }

  function renderChips(){
    const speciesChipsEl = document.getElementById('species-chips');
    speciesChipsEl.innerHTML = SPECIES_LIST.map(sp => {
      const active = sp === state.species ? 'active' : '';
      const n = speciesBrandCount(sp);
      const disabled = n === 0 ? 'disabled' : '';
      return `<div class="chip ${active} ${disabled}" onclick="${n ? `goSpecies('${sp}')` : ''}">${sp}${n ? '' : ' (준비중)'}</div>`;
    }).join('');

    const brandChipsEl = document.getElementById('brand-chips');
    if (state.species && speciesBrandCount(state.species) > 0){
      const brands = Object.keys(speciesBrands(state.species));
      brandChipsEl.classList.remove('hidden');
      brandChipsEl.innerHTML = brands.map(b => {
        const partCount = Object.keys(MANIFEST[state.species][b]).length;
        const active = b === state.brand ? 'active' : '';
        return `<div class="chip ${active}" onclick="goBrand('${state.species}','${b}')">${b}<span class="n">${partCount}</span></div>`;
      }).join('');
    } else {
      brandChipsEl.classList.add('hidden');
      brandChipsEl.innerHTML = '';
    }

    const partChipsEl = document.getElementById('part-chips');
    if (state.species && state.brand){
      const parts = MANIFEST[state.species][state.brand];
      partChipsEl.classList.remove('hidden');
      partChipsEl.innerHTML = Object.keys(parts).map(p => {
        const active = p === state.part ? 'active' : '';
        return `<div class="chip ${active}" onclick="goPart('${state.species}','${state.brand}','${p}')">${parts[p].displayName}</div>`;
      }).join('');
    } else {
      partChipsEl.classList.add('hidden');
      partChipsEl.innerHTML = '';
    }
  }

  function render(){
    if (document.startViewTransition){
      document.startViewTransition(() => renderInner());
    } else {
      renderInner();
    }
  }

  // batches 배열에 사진 시작 인덱스(_start)를 계산해서 붙여줌 (전역 photos 배열과의 매핑용)
  function batchesWithOffset(obj){
    let cursor = 0;
    return (obj.batches || []).map(b => {
      const start = cursor;
      cursor += (b.photoCount || 0);
      return Object.assign({}, b, { _start: start });
    });
  }
  function distinctValues(batches, key, filterFn){
    const set = new Set();
    batches.forEach(b => { if ((!filterFn || filterFn(b)) && b[key]) set.add(String(b[key])); });
    return [...set];
  }
  function optionThumb(obj, batches){
    const first = batches[0];
    return first ? toThumbUrl(obj.photos[first._start]) : '';
  }
  function optionPhotoCount(batches){
    return batches.reduce((s,b) => s + (b.photoCount||0), 0);
  }

  function renderInner(){
    renderChips();
    const main = document.getElementById('main');

    // 0층: 축종 선택
    if (!state.species){
      const cardsHtml = SPECIES_LIST.map(sp => {
        const n = speciesBrandCount(sp);
        if (n === 0){
          return `
            <div class="select-card disabled">
              ${thumbHtml('', '준비중')}
              <div class="body">
                <div class="name">${sp}</div>
                <div class="sub">준비중</div>
              </div>
            </div>
          `;
        }
        return `
          <div class="select-card" onclick="goSpecies('${sp}')">
            ${thumbHtml(speciesThumbUrl(sp), `${n}개 브랜드`)}
            <div class="body">
              <div class="name">${sp}</div>
              <div class="sub">${speciesPhotoCount(sp)}장</div>
            </div>
          </div>
        `;
      }).join('');
      main.innerHTML = `<div class="select-grid">${cardsHtml}</div>`;
      return;
    }

    // 1층: 브랜드 선택
    if (!state.brand){
      const brands = Object.keys(speciesBrands(state.species));
      if (brands.length === 0){
        main.innerHTML = `
          <div class="page-breadcrumb">
            <button class="back-btn" onclick="goHome()">← 뒤로</button>
            <span class="crumb" onclick="goHome()">전체</span>
            <span class="sep">›</span>
            <span class="current">${state.species}</span>
          </div>
          <div class="empty-state">${state.species} 사진은 아직 준비중입니다</div>
        `;
        return;
      }
      const cardsHtml = brands.map(b => {
        const partCount = Object.keys(MANIFEST[state.species][b]).length;
        const photoCount = brandPhotoCount(state.species, b);
        return `
          <div class="select-card" onclick="goBrand('${state.species}','${b}')">
            ${thumbHtml(brandThumbUrl(state.species, b), `${partCount}개 부위`)}
            <div class="body">
              <div class="name">${b}</div>
              <div class="sub">${photoCount}장</div>
            </div>
          </div>
        `;
      }).join('');
      main.innerHTML = `
        <div class="page-breadcrumb">
          <button class="back-btn" onclick="goHome()">← 뒤로</button>
          <span class="crumb" onclick="goHome()">전체</span>
          <span class="sep">›</span>
          <span class="current">${state.species}</span>
        </div>
        <div class="select-grid">${cardsHtml}</div>
      `;
      return;
    }

    // 2층: 부위 선택
    if (!state.part){
      const parts = MANIFEST[state.species][state.brand];
      const cardsHtml = Object.keys(parts).map(p => {
        const obj = parts[p];
        return `
          <div class="select-card" onclick="goPart('${state.species}','${state.brand}','${p}')">
            ${thumbHtml(partThumbUrl(state.species, state.brand, p), `${obj.photos.length}장`)}
            <div class="body">
              <div class="name">${obj.displayName}</div>
              <div class="sub">${state.brand}</div>
            </div>
          </div>
        `;
      }).join('');
      main.innerHTML = `
        <div class="page-breadcrumb">
          <button class="back-btn" onclick="goSpecies('${state.species}')">← 뒤로</button>
          <span class="crumb" onclick="goHome()">전체</span>
          <span class="sep">›</span>
          <span class="crumb" onclick="goSpecies('${state.species}')">${state.species}</span>
          <span class="sep">›</span>
          <span class="current">${state.brand}</span>
        </div>
        <div class="select-grid">${cardsHtml}</div>
      `;
      return;
    }

    const obj = getObj();
    const allBatches = batchesWithOffset(obj);
    const breadcrumbHead = `
      <span class="crumb" onclick="goHome()">전체</span>
      <span class="sep">›</span>
      <span class="crumb" onclick="goSpecies('${state.species}')">${state.species}</span>
      <span class="sep">›</span>
      <span class="crumb" onclick="goBrand('${state.species}','${state.brand}')">${state.brand}</span>
      <span class="sep">›</span>
      <span class="crumb" onclick="goPart('${state.species}','${state.brand}','${state.part}')">${obj.displayName}</span>
    `;

    // 3층: EST 선택 (한 부위 안에 EST가 2개 이상 섞여 있을 때만 등장, 아니면 자동 통과)
    const estOptions = distinctValues(allBatches, 'EST');
    if (estOptions.length > 1 && !state.est){
      const cardsHtml = estOptions.map(est => {
        const matched = allBatches.filter(b => String(b.EST) === est);
        return `
          <div class="select-card" onclick="goEst('${state.species}','${state.brand}','${state.part}','${est}')">
            ${thumbHtml(optionThumb(obj, matched), `${optionPhotoCount(matched)}장`)}
            <div class="body">
              <div class="name">EST ${est}</div>
              <div class="sub">${obj.displayName}</div>
            </div>
          </div>
        `;
      }).join('');
      main.innerHTML = `
        <div class="page-breadcrumb">
          <button class="back-btn" onclick="goBrand('${state.species}','${state.brand}')">← 뒤로</button>
          ${breadcrumbHead}
        </div>
        <div class="select-grid">${cardsHtml}</div>
      `;
      return;
    }

    // 4층: 등급 선택 (EST 확정 후, 등급이 2개 이상 섞여 있을 때만 등장)
    const estFiltered = allBatches.filter(b => !state.est || String(b.EST) === state.est);
    const gradeOptions = distinctValues(estFiltered, '등급');
    if (gradeOptions.length > 1 && !state.grade){
      const cardsHtml = gradeOptions.map(grade => {
        const matched = estFiltered.filter(b => b['등급'] === grade);
        return `
          <div class="select-card" onclick="goGrade('${state.species}','${state.brand}','${state.part}','${state.est||''}','${grade}')">
            ${thumbHtml(optionThumb(obj, matched), `${optionPhotoCount(matched)}장`)}
            <div class="body">
              <div class="name">등급 ${grade}</div>
              <div class="sub">${state.est ? 'EST ' + state.est : obj.displayName}</div>
            </div>
          </div>
        `;
      }).join('');
      main.innerHTML = `
        <div class="page-breadcrumb">
          <button class="back-btn" onclick="goPart('${state.species}','${state.brand}','${state.part}')">← 뒤로</button>
          ${breadcrumbHead}
          ${state.est ? `<span class="sep">›</span><span class="crumb" onclick="goEst('${state.species}','${state.brand}','${state.part}','${state.est}')">EST ${state.est}</span>` : ''}
        </div>
        <div class="select-grid">${cardsHtml}</div>
      `;
      return;
    }

    // 5층: 사진 + 정보 (EST/등급까지 확정된, 혹은 애초에 구분이 필요 없던 최종 상태)
    const finalBatches = estFiltered.filter(b => !state.grade || b['등급'] === state.grade);

    function photoCell(url, i){
      return `
      <div class="photo-wrap skeleton-thumb">
        <img src="${toThumbUrl(url)}" onclick="openLightbox(${i})" onload="this.parentElement.classList.add('loaded')" onerror="this.parentElement.classList.add('loaded')">
        <button class="download-btn" onclick="downloadPhoto('${url}', ${i}, this)" title="다운로드">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
        </button>
      </div>`;
    }

    // 숫자(수량/중량 등)는 천단위 콤마로 표시. 정수면 소수점 없이, 아니면 최대 2자리까지.
    function fmtQty(v){
      if (v === null || v === undefined || v === '') return v;
      const num = Number(v);
      if (isNaN(num)) return v;
      return num.toLocaleString('ko-KR', { maximumFractionDigits: 2 });
    }
    const NUMERIC_FIELDS = new Set(['수량(BOX)','중량(KG)','재고수량','중량(kg)']);

    // 배치 정보 한 줄 요약에 쓸 필드 순서 (자재명/BL/EST/등급을 우선 노출)
    const BATCH_FIELD_ORDER = ['자재명','BL','EST','등급','원산지','창고','구매처','수량(BOX)','중량(KG)','선적일','입고일','통관일','유통기한','유통이력번호','비고'];
    function batchInfoRows(b){
      return BATCH_FIELD_ORDER.filter(k => b[k] !== undefined && b[k] !== null && b[k] !== '')
        .map(k => `<div class="row"><span class="k">${k}</span><span class="v">${NUMERIC_FIELDS.has(k) ? fmtQty(b[k]) : b[k]}</span></div>`).join('');
    }

    let bodyHtml;
    let totalCount;
    if (Array.isArray(obj.batches)){
      // 배치(ERP) 구조: EST/등급까지 좁혀진 배치들만 자재명/BL 단위로 섹션을 나눠서 표시
      const sections = finalBatches.map((b) => {
        const cellsHtml = obj.photos.slice(b._start, b._start + (b.photoCount||0))
          .map((url, j) => photoCell(url, b._start + j)).join('');
        return `
          <div class="batch-section">
            <div class="batch-header">
              <span class="batch-title">${b.label || obj.displayName}</span>
              ${b.BL ? `<span class="batch-bl">BL ${b.BL}</span>` : ''}
            </div>
            <div class="photo-grid">${cellsHtml}</div>
            <div class="detail-info batch-info">${batchInfoRows(b)}</div>
          </div>
        `;
      }).join('');
      bodyHtml = sections;
      totalCount = optionPhotoCount(finalBatches);
    } else if (obj.sample){
      // 샘플(ERP 정보 없음): 사진만, 안내 배지만 표시
      const cellsHtml = obj.photos.map((url, i) => photoCell(url, i)).join('');
      bodyHtml = `
        <div class="sample-badge">샘플 — ${obj.note || 'ERP 정보 없음'}</div>
        <div class="photo-grid">${cellsHtml}</div>
      `;
      totalCount = obj.photos.length;
    } else {
      // 레거시: 부위 전체에 정보 한 블록 (기존 방식 그대로)
      const cellsHtml = obj.photos.map((url, i) => photoCell(url, i)).join('');
      const infoHtml = Object.entries(obj.info || {}).map(([k,v]) => `
        <div class="row"><span class="k">${k}</span><span class="v">${NUMERIC_FIELDS.has(k) ? fmtQty(v) : v}</span></div>
      `).join('');
      bodyHtml = `<div class="photo-grid">${cellsHtml}</div><div class="detail-info">${infoHtml}</div>`;
      totalCount = obj.photos.length;
    }

    let backOnclick;
    if (state.grade && estOptions.length > 1 || state.grade && gradeOptions.length > 1){
      backOnclick = `goEst('${state.species}','${state.brand}','${state.part}','${state.est||''}')`;
    } else if (state.est && estOptions.length > 1){
      backOnclick = `goPart('${state.species}','${state.brand}','${state.part}')`;
    } else {
      backOnclick = `goBrand('${state.species}','${state.brand}')`;
    }

    main.innerHTML = `
      <div class="page-breadcrumb">
        <button class="back-btn" onclick="${backOnclick}">← 뒤로</button>
        ${breadcrumbHead}
        ${state.est ? `<span class="sep">›</span><span class="crumb" onclick="goEst('${state.species}','${state.brand}','${state.part}','${state.est}')">EST ${state.est}</span>` : ''}
        ${state.grade ? `<span class="sep">›</span><span class="current">등급 ${state.grade}</span>` : ''}
      </div>
      <div class="action-row">
        <button class="download-all-btn secondary" onclick="copyPageLink(this)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          현재 페이지 링크 복사
        </button>
        <button class="download-all-btn" onclick="downloadAll()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3v12"/><path d="M6 11l6 6 6-6"/><path d="M5 21h14"/></svg>
          전체 ${totalCount}장 다운로드
        </button>
      </div>
      ${bodyHtml}
    `;
  }

  let lightboxIndex = 0;

  function openLightbox(i){
    showSlide(i);
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  // 사진 한 장만 표시하고, 넘길 때 슬라이드 애니메이션 없이 바로 교체한다.
  function showSlide(idx){
    const photos = getObj().photos;
    lightboxIndex = idx;
    const img = document.getElementById('lightbox-img');
    img.src = photos[idx];
    img.dataset.scale = 1; img.dataset.tx = 0; img.dataset.ty = 0;
    img.style.transform = 'translate(0px, 0px) scale(1)';
    img.style.touchAction = 'none';
    updateLightboxCounter();
    updateNavButtons();
    // 양옆 사진은 미리 캐시에 받아둬서 넘길 때 로딩 없이 바로 뜨게 함
    [photos[idx - 1], photos[idx + 1]].forEach(url => {
      if (url){ const pre = new Image(); pre.src = url; }
    });
  }

  // 좌우 넘기기 버튼 (지마켓 상품 이미지처럼) - 슬라이드 애니메이션 없이 바로 다음/이전 사진으로 교체
  function lightboxNav(delta){
    const photos = getObj().photos;
    const idx = Math.max(0, Math.min(photos.length - 1, lightboxIndex + delta));
    if (idx === lightboxIndex) return;
    showSlide(idx);
  }

  function updateNavButtons(){
    const photos = getObj().photos;
    document.getElementById('lightbox-prev-btn').classList.toggle('disabled', lightboxIndex <= 0);
    document.getElementById('lightbox-next-btn').classList.toggle('disabled', lightboxIndex >= photos.length - 1);
  }

  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function updateLightboxCounter(){
    const photos = getObj().photos;
    document.getElementById('lightbox-counter').textContent = `${lightboxIndex+1} / ${photos.length}`;
  }

  // 핀치줌 / 더블탭 확대 / 확대 상태에서 드래그 이동 (인스타그램 스타일)
  // + 웹(마우스/트랙패드): 휠로 확대·축소, 좌우 스와이프는 버튼으로 (슬라이드 애니메이션 없이 즉시 전환)
  function initZoomHandlers(stage){
    const MAX_SCALE = 4;
    const SWIPE_THRESHOLD = 60; // 이 이상 드래그해야 다음/이전 사진으로 넘어감
    const pointers = new Map();
    let pinchStartDist = 0, pinchStartScale = 1;
    let panStart = null;
    let lastTapTime = 0, lastTapImg = null;
    let swipeTrack = null; // 확대 안 된 상태에서 드래그로 넘기기 판정용 (마우스+터치 공용, 시각적 이동 없이 놓을 때만 판정)
    let downInfo = null; // 이번 포인터가 탭인지 드래그인지 판정하기 위한 시작 위치 기록

    function getImg(target){
      return target && target.tagName === 'IMG' ? target : null;
    }
    function dist(pts){
      const [a,b] = pts;
      return Math.hypot(a.x-b.x, a.y-b.y);
    }
    function applyTransform(img){
      img.style.transform = `translate(${img.dataset.tx}px, ${img.dataset.ty}px) scale(${img.dataset.scale})`;
    }
    function clampPan(img, scale){
      const rect = img.getBoundingClientRect();
      const parentRect = img.parentElement.getBoundingClientRect();
      const maxX = Math.max(0, (rect.width * scale - parentRect.width) / 2);
      const maxY = Math.max(0, (rect.height * scale - parentRect.height) / 2);
      img.dataset.tx = Math.min(maxX, Math.max(-maxX, parseFloat(img.dataset.tx)));
      img.dataset.ty = Math.min(maxY, Math.max(-maxY, parseFloat(img.dataset.ty)));
    }
    function zoomImgBy(img, delta){
      let scale = parseFloat(img.dataset.scale || 1) + delta;
      scale = Math.min(MAX_SCALE, Math.max(1, scale));
      img.dataset.scale = scale;
      clampPan(img, scale);
      applyTransform(img);
    }

    const TAP_MOVE_THRESHOLD = 10; // 이 이하로 움직이면 '탭'으로 간주 (더블탭 판정용)

    stage.addEventListener('pointerdown', (e) => {
      const img = getImg(e.target);
      if (!img) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      img.setPointerCapture(e.pointerId);

      if (pointers.size === 1){
        // 탭인지 드래그인지는 손을 뗄 때(pointerup) 이동거리로 판정한다.
        // 여기서 더블탭 여부를 바로 확정해버리면, 스와이프 시작점이 우연히
        // 직전 탭과 가까운 시간에 눌렸을 때 확대 토글로 오작동하는 문제가 있었음.
        downInfo = { img, x: e.clientX, y: e.clientY };
        if (parseFloat(img.dataset.scale || 1) > 1){
          panStart = { x: e.clientX, y: e.clientY, tx: parseFloat(img.dataset.tx||0), ty: parseFloat(img.dataset.ty||0), img };
        } else {
          // 확대 안 된 상태 - 넘기기 제스처 판정 시작 (시각적으로는 움직이지 않고, 놓을 때 임계값 넘었으면 바로 전환)
          swipeTrack = { startX: e.clientX, startY: e.clientY };
          stage.classList.add('dragging');
        }
      } else if (pointers.size === 2){
        const pts = Array.from(pointers.values());
        pinchStartDist = dist(pts);
        pinchStartScale = parseFloat(img.dataset.scale || 1);
        panStart = null;
        swipeTrack = null;
        downInfo = null;
        stage.classList.remove('dragging');
        e.preventDefault();
      }
    });


    stage.addEventListener('pointermove', (e) => {
      if (!pointers.has(e.pointerId)) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      const img = getImg(e.target) || (downInfo && downInfo.img);
      if (!img) return;

      if (pointers.size === 2 && pinchStartDist > 0){
        const pts = Array.from(pointers.values());
        const newDist = dist(pts);
        let scale = pinchStartScale * (newDist / pinchStartDist);
        scale = Math.min(MAX_SCALE, Math.max(1, scale));
        img.dataset.scale = scale;
        clampPan(img, scale);
        applyTransform(img);
      } else if (pointers.size === 1 && panStart && panStart.img === img){
        const dx = e.clientX - panStart.x;
        const dy = e.clientY - panStart.y;
        img.dataset.tx = panStart.tx + dx;
        img.dataset.ty = panStart.ty + dy;
        clampPan(img, parseFloat(img.dataset.scale || 1));
        applyTransform(img);
      }
    });

    function endPointer(e){
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinchStartDist = 0;
      if (pointers.size === 0) panStart = null;
      stage.classList.remove('dragging');

      if (!downInfo){ swipeTrack = null; return; }
      const totalDx = e.clientX - downInfo.x;
      const totalDy = e.clientY - downInfo.y;
      const movedDist = Math.hypot(totalDx, totalDy);
      const img = downInfo.img;
      const wasSwipeTrack = swipeTrack;
      downInfo = null;
      swipeTrack = null;

      if (movedDist < TAP_MOVE_THRESHOLD){
        // 거의 움직이지 않은 '탭' - 더블탭 확대 판정
        const now = Date.now();
        if (lastTapImg === img && now - lastTapTime < 300){
          const cur = parseFloat(img.dataset.scale || 1);
          if (cur > 1){
            img.dataset.scale = 1; img.dataset.tx = 0; img.dataset.ty = 0;
          } else {
            img.dataset.scale = 2.5;
            img.dataset.tx = 0; img.dataset.ty = 0;
          }
          applyTransform(img);
          lastTapTime = 0;
        } else {
          lastTapTime = now;
          lastTapImg = img;
        }
        return;
      }

      // 드래그였으므로 더블탭 판정에 영향 주지 않도록 무효화
      lastTapTime = 0;

      // 가로로 충분히 끌었을 때만 넘기기로 인정 (세로 스크롤 제스처와 헷갈리지 않도록)
      if (wasSwipeTrack && Math.abs(totalDx) > SWIPE_THRESHOLD && Math.abs(totalDx) > Math.abs(totalDy)){
        lightboxNav(totalDx < 0 ? 1 : -1);
      }
    }
    stage.addEventListener('pointerup', endPointer);
    stage.addEventListener('pointercancel', endPointer);

    // 지마켓 상품 이미지처럼: 휠(마우스/트랙패드)은 확대/축소 전용
    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      const img = document.getElementById('lightbox-img');
      zoomImgBy(img, -e.deltaY * 0.015);
    }, { passive: false });
  }


  function lightboxDownload(e){
    e.stopPropagation();
    const photos = getObj().photos;
    downloadPhoto(photos[lightboxIndex], lightboxIndex, document.getElementById('lightbox-dl-btn'));
  }

  // 클립보드 복사 (구형 브라우저/HTTP 환경 대비 fallback 포함)
  async function copyToClipboard(text){
    try {
      if (navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch(e) { /* fallback으로 진행 */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch(e) {
      return false;
    }
  }

  async function copyPageLink(btnEl){
    const ok = await copyToClipboard(location.href);
    if (ok){
      showToast('링크가 복사됐습니다.');
      if (btnEl){
        btnEl.classList.add('copied');
        setTimeout(() => btnEl.classList.remove('copied'), 1200);
      }
    } else {
      showToast('복사에 실패했어요. 주소창을 직접 복사해주세요.');
    }
  }

  document.addEventListener('keydown', (e) => {
    const lb = document.getElementById('lightbox');
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') lightboxNav(-1);
    if (e.key === 'ArrowRight') lightboxNav(1);
  });

  initZoomHandlers(document.getElementById('lightbox-stage'));

  function showToast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    const duration = Math.max(2200, Math.min(msg.length * 70, 6000));
    t._timer = setTimeout(() => t.classList.remove('show'), duration);
  }

  // R2 등 외부 도메인 사진은 <a download>가 무시되고 그냥 열리기만 하므로
  // fetch로 받아 blob URL을 만들어 강제로 다운로드시킨다.
  // 캐시된 옛 응답(CORS 헤더 없음)을 피하기 위해 캐시 우회 쿼리를 붙여서 요청한다.
  async function fetchAsBlob(url, retries = 1){
    const bustUrl = url + (url.includes('?') ? '&' : '?') + '_dl=' + Date.now() + Math.random().toString(36).slice(2);
    for (let attempt = 0; attempt <= retries; attempt++){
      try {
        const res = await fetch(bustUrl, { cache: 'no-store' });
        if (!res.ok) throw new Error('fetch 실패: ' + res.status);
        return await res.blob();
      } catch(e) {
        if (attempt === retries) throw e;
        await new Promise(r => setTimeout(r, 500));
      }
    }
  }

  function triggerBlobDownload(blob, url){
    const blobUrl = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = blobUrl;
    const originalName = decodeURIComponent(url.split('/').pop().split('?')[0]);
    const dot = originalName.lastIndexOf('.');
    const base = dot > -1 ? originalName.slice(0, dot) : originalName;
    const extPart = dot > -1 ? originalName.slice(dot) : '';
    a.download = `${base}_${Date.now()}${extPart}`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
  }

  // 단일 사진 다운로드 (버튼 직접 클릭 시 - 실패하면 새 탭으로 폴백)
  async function downloadPhoto(url, i, btnEl){
    if (btnEl) btnEl.classList.add('loading');
    try {
      const blob = await fetchAsBlob(url, 1);
      triggerBlobDownload(blob, url);
    } catch(e) {
      console.error('다운로드 실패', e);
      window.open(url, '_blank');
      showToast('직접 다운로드가 안 돼서 새 탭에 열었어요. 길게 눌러 저장해주세요.');
    } finally {
      if (btnEl) btnEl.classList.remove('loading');
    }
  }

  // 전체 다운로드 (배치 중엔 새 탭을 띄우지 않고, 끝나고 실패 목록만 안내)
  async function downloadAll(){
    const obj = getObj();
    showToast(`${obj.photos.length}장 다운로드를 시작합니다`);
    const failed = [];
    for (let i = 0; i < obj.photos.length; i++){
      try {
        const blob = await fetchAsBlob(obj.photos[i], 1);
        triggerBlobDownload(blob, obj.photos[i]);
      } catch(e) {
        console.error('배치 다운로드 실패', obj.photos[i], e);
        failed.push(i + 1);
      }
      await new Promise(r => setTimeout(r, 450));
    }
    if (failed.length === 0){
      showToast(`${obj.photos.length}장 전부 다운로드 완료`);
    } else {
      showToast(`${obj.photos.length - failed.length}장 성공, ${failed.length}장 실패(${failed.join(',')}번). 실패한 사진은 개별 다운로드 버튼으로 다시 받아주세요.`);
    }
  }

  loadData();
</script>
