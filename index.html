<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>축산 라이브러리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jetbrains-mono/2.304/web/woff2/JetBrainsMono.min.css" onerror="this.remove()">
<style>
  :root{
    --bg: #EFF3F1;
    --ink: #16201C;
    --sub: #5C6B64;
    --line: #D3DCD7;
    --accent: #A8431F;   /* 저장육 색조 */
    --cold: #33586B;     /* 냉장 느낌의 차가운 청록 */
    --card: #FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:'JetBrains Mono', ui-monospace, monospace; }

  header{
    padding: 28px 20px 20px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .brand-row{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom:18px;
  }
  .brand-row h1{
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.01em;
    margin:0;
  }
  .brand-row span{
    font-size: 12px;
    color: var(--sub);
    font-family:'JetBrains Mono', monospace;
  }

  .search-wrap{
    max-width: 720px;
  }
  .search-box{
    display:flex;
    align-items:center;
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px 14px;
    gap: 10px;
  }
  .search-box:focus-within{
    border-color: var(--accent);
  }
  .search-box input{
    border:none;
    outline:none;
    font-size:16px;
    flex:1;
    background:transparent;
    color: var(--ink);
    font-family:'Pretendard', sans-serif;
  }
  .search-box input::placeholder{ color:#9AA6A0; }
  .search-icon{ color: var(--sub); flex-shrink:0; }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:10px;
    max-width: 720px;
  }
  .tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    padding: 4px 9px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--sub);
    cursor: pointer;
    white-space: nowrap;
  }
  .tag:hover{ border-color: var(--cold); color: var(--cold); }
  .tag.active{ background: var(--accent); border-color: var(--accent); color: #fff; }

  main{ padding: 20px; max-width: 1100px; margin: 0 auto; }

  .empty-state{
    text-align:center;
    padding: 90px 20px;
    color: var(--sub);
  }
  .empty-state .big{
    font-size: 15px;
    color: var(--ink);
    font-weight: 600;
    margin-bottom: 6px;
  }
  .empty-state .small{ font-size: 13px; }

  .result-count{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--sub);
    margin: 4px 0 16px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .item-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .photo-strip{
    display:grid;
    grid-auto-flow: column;
    grid-auto-columns: 100%;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    aspect-ratio: 4/3;
    background: #E3E8E5;
  }
  .photo-strip img{
    width:100%; height:100%;
    object-fit: cover;
    scroll-snap-align: start;
  }
  .photo-strip .no-photo{
    display:flex; align-items:center; justify-content:center;
    color: var(--sub);
    font-size: 12px;
    font-family:'JetBrains Mono', monospace;
  }
  .item-body{ padding: 12px 14px 14px; }
  .item-brand{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .item-name{
    font-size: 15px;
    font-weight: 700;
    margin: 3px 0 6px;
  }
  .item-meta{
    font-size: 12.5px;
    color: var(--sub);
    line-height: 1.5;
  }
  .photo-count{
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--sub);
    margin-top: 6px;
  }
</style>
</head>
<body>

<header>
  <div class="brand-row">
    <h1>축산 라이브러리</h1>
    <span>PHOTO ARCHIVE</span>
  </div>
  <div class="search-wrap">
    <div class="search-box">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="searchInput" type="text" placeholder="브랜드나 품목명으로 검색 (예: SEARA 삼겹)" autocomplete="off">
    </div>
    <div class="tags" id="brandTags"></div>
  </div>
</header>

<main>
  <div id="resultCount" class="result-count" style="display:none;"></div>
  <div id="grid" class="grid"></div>
  <div id="emptyState" class="empty-state">
    <div class="big">아직 등록된 사진이 없습니다</div>
    <div class="small">사진이 추가되면 여기서 브랜드·품목명으로 검색할 수 있어요</div>
  </div>
</main>

<script>
  let ITEMS = [];
  let BRANDS = [];
  let activeBrand = null;

  async function loadData(){
    try {
      const [itemsRes, brandsRes] = await Promise.all([
        fetch('data/manifest.json').then(r => r.ok ? r.json() : []),
        fetch('data/brands.json').then(r => r.ok ? r.json() : [])
      ]);
      ITEMS = itemsRes || [];
      BRANDS = brandsRes || [];
    } catch(e) {
      console.error('데이터 로드 실패', e);
      ITEMS = [];
      BRANDS = [];
    }
    renderBrandTags();
    render();
  }

  function renderBrandTags(){
    const wrap = document.getElementById('brandTags');
    wrap.innerHTML = '';
    BRANDS.forEach(b => {
      const el = document.createElement('div');
      el.className = 'tag' + (activeBrand === b ? ' active' : '');
      el.textContent = b;
      el.onclick = () => {
        activeBrand = (activeBrand === b) ? null : b;
        renderBrandTags();
        render();
      };
      wrap.appendChild(el);
    });
  }

  function matches(item, query, brand){
    const hay = (item.brand + ' ' + item.name + ' ' + (item.part||'') + ' ' + (item.notes||'')).toLowerCase();
    const q = query.trim().toLowerCase();
    if (brand && item.brand !== brand) return false;
    if (!q) return true;
    return q.split(/\s+/).every(term => hay.includes(term));
  }

  function render(){
    const query = document.getElementById('searchInput').value;
    const filtered = ITEMS.filter(it => matches(it, query, activeBrand));

    const grid = document.getElementById('grid');
    const emptyState = document.getElementById('emptyState');
    const resultCount = document.getElementById('resultCount');

    if (ITEMS.length === 0) {
      grid.innerHTML = '';
      resultCount.style.display = 'none';
      emptyState.style.display = 'block';
      emptyState.querySelector('.big').textContent = '아직 등록된 사진이 없습니다';
      emptyState.querySelector('.small').textContent = '사진이 추가되면 여기서 브랜드·품목명으로 검색할 수 있어요';
      return;
    }

    if (filtered.length === 0) {
      grid.innerHTML = '';
      resultCount.style.display = 'none';
      emptyState.style.display = 'block';
      emptyState.querySelector('.big').textContent = '검색 결과가 없습니다';
      emptyState.querySelector('.small').textContent = '다른 브랜드나 품목명으로 검색해보세요';
      return;
    }

    emptyState.style.display = 'none';
    resultCount.style.display = 'block';
    resultCount.textContent = `${filtered.length}건`;

    grid.innerHTML = filtered.map(it => {
      const photos = it.photos && it.photos.length ? it.photos : [];
      const photoHtml = photos.length
        ? photos.map(url => `<img src="${url}" loading="lazy" alt="${it.name}">`).join('')
        : `<div class="no-photo">사진 없음</div>`;
      return `
        <div class="item-card">
          <div class="photo-strip">${photoHtml}</div>
          <div class="item-body">
            <div class="item-brand">${it.brand || ''}</div>
            <div class="item-name">${it.name || ''}</div>
            <div class="item-meta">${it.part ? it.part + ' · ' : ''}${it.notes || ''}</div>
            ${photos.length ? `<div class="photo-count">사진 ${photos.length}장</div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  document.getElementById('searchInput').addEventListener('input', render);
  loadData();
</script>

</body>
</html>
