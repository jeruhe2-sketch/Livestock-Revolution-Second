<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>축산 라이브러리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --bg: #EFF3F1;
    --ink: #16201C;
    --sub: #5C6B64;
    --line: #D3DCD7;
    --accent: #A8431F;
    --cold: #33586B;
    --card: #FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Pretendard', -apple-system, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{ font-family:ui-monospace, 'SF Mono', monospace; }

  header{
    padding: 24px 20px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .brand-row{ display:flex; align-items:baseline; gap:10px; }
  .brand-row h1{ font-size: 20px; font-weight: 800; margin:0; cursor:pointer; }
  .brand-row span{ font-size: 11px; color: var(--sub); font-family:ui-monospace,monospace; }

  .breadcrumb{
    margin-top: 10px;
    font-size: 13px;
    color: var(--sub);
  }
  .breadcrumb .crumb{ cursor:pointer; color: var(--cold); }
  .breadcrumb .crumb:hover{ text-decoration: underline; }

  main{ padding: 16px 20px 60px; max-width: 1000px; margin: 0 auto; }

  /* 브랜드 목록 */
  .brand-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 12px;
    margin-top: 16px;
  }
  .brand-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 12px;
    text-align: center;
    cursor: pointer;
    font-weight: 700;
    font-size: 15px;
  }
  .brand-card:hover{ border-color: var(--accent); color: var(--accent); }
  .brand-card .count{
    display:block;
    font-size: 11px;
    color: var(--sub);
    font-weight: 400;
    margin-top: 4px;
    font-family: ui-monospace,monospace;
  }

  /* 부위 목록 */
  .part-list{ margin-top: 16px; display:flex; flex-direction:column; gap:10px; }
  .part-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    display:flex;
    justify-content: space-between;
    align-items:center;
  }
  .part-card:hover{ border-color: var(--accent); }
  .part-card .name{ font-weight: 700; font-size: 15px; }
  .part-card .photo-count{ font-size: 12px; color: var(--sub); font-family: ui-monospace,monospace; }

  /* 상세 화면 */
  .detail-info{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px 18px;
    margin-top: 16px;
  }
  .detail-info .row{
    display:flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px dashed var(--line);
    font-size: 13.5px;
  }
  .detail-info .row:last-child{ border-bottom:none; }
  .detail-info .row .k{ color: var(--sub); }
  .detail-info .row .v{ font-weight: 600; font-family: ui-monospace,monospace; text-align:right; }

  .photo-scroll{
    margin-top: 16px;
    display:flex;
    gap: 10px;
    overflow-x: auto;
    padding-bottom: 8px;
  }
  .photo-scroll img{
    height: 260px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: #fff;
    flex-shrink:0;
  }

  .empty-state{ text-align:center; padding: 60px 20px; color: var(--sub); }
</style>
</head>
<body>

<header>
  <div class="brand-row" onclick="goHome()">
    <h1>축산 라이브러리</h1>
    <span>PHOTO ARCHIVE</span>
  </div>
  <div class="breadcrumb" id="breadcrumb"></div>
</header>

<main id="main"></main>

<script>
  let MANIFEST = {};
  let state = { brand: null, part: null };

  async function loadData(){
    try {
      MANIFEST = await fetch('data/manifest.json').then(r => r.json());
    } catch(e) {
      console.error('로드 실패', e);
      MANIFEST = {};
    }
    render();
  }

  function goHome(){ state = { brand: null, part: null }; render(); }
  function goBrand(b){ state = { brand: b, part: null }; render(); }
  function goPart(b, p){ state = { brand: b, part: p }; render(); }

  function renderBreadcrumb(){
    const bc = document.getElementById('breadcrumb');
    let html = `<span class="crumb" onclick="goHome()">전체</span>`;
    if (state.brand){
      html += ` / <span class="crumb" onclick="goBrand('${state.brand}')">${state.brand}</span>`;
    }
    if (state.part){
      const displayName = MANIFEST[state.brand][state.part].displayName;
      html += ` / <span>${displayName}</span>`;
    }
    bc.innerHTML = html;
  }

  function render(){
    renderBreadcrumb();
    const main = document.getElementById('main');
    const brands = Object.keys(MANIFEST);

    if (brands.length === 0){
      main.innerHTML = `<div class="empty-state">아직 등록된 사진이 없습니다</div>`;
      return;
    }

    // 1단계: 브랜드 목록
    if (!state.brand){
      main.innerHTML = `<div class="brand-grid">` + brands.map(b => {
        const partCount = Object.keys(MANIFEST[b]).length;
        return `<div class="brand-card" onclick="goBrand('${b}')">${b}<span class="count">${partCount}개 부위</span></div>`;
      }).join('') + `</div>`;
      return;
    }

    // 2단계: 부위 목록
    if (state.brand && !state.part){
      const parts = MANIFEST[state.brand];
      main.innerHTML = `<div class="part-list">` + Object.keys(parts).map(p => {
        const obj = parts[p];
        return `<div class="part-card" onclick="goPart('${state.brand}','${p}')">
          <span class="name">${obj.displayName}</span>
          <span class="photo-count">사진 ${obj.photos.length}장</span>
        </div>`;
      }).join('') + `</div>`;
      return;
    }

    // 3단계: 상세 (사진 + 정보)
    const obj = MANIFEST[state.brand][state.part];
    const photoHtml = obj.photos.map(url => `<img src="${url}" loading="lazy">`).join('');
    const infoHtml = Object.entries(obj.info).map(([k,v]) => `
      <div class="row"><span class="k">${k}</span><span class="v">${v}</span></div>
    `).join('');

    main.innerHTML = `
      <div class="photo-scroll">${photoHtml}</div>
      <div class="detail-info">${infoHtml}</div>
    `;
  }

  loadData();
</script>

</body>
</html>
