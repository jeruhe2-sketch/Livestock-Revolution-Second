<path d="M200 172 Q270 155 350 172 L350 200 Q270 188 205 200 Z" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 삼겹살(하단 배 밴드) -->
<path d="M205 200 Q270 188 350 200 L350 232 Q270 248 210 232 Z" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 후지(뒷다리) -->
<ellipse cx="360" cy="235" rx="35" ry="30" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<rect x="345" y="255" width="30" height="35" rx="8" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 전지(앞다리/어깨살) -->
<ellipse cx="175" cy="220" rx="28" ry="26" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 앞사태 -->
<rect x="163" y="242" width="22" height="26" rx="6" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 장족 -->
<rect x="160" y="266" width="26" height="20" rx="5" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 등뼈(등 라인) -->
<path d="M195 150 Q270 128 350 148" fill="none" stroke="#8B8064" stroke-width="6" stroke-linecap="round"/>
<!-- 항정살(턱밑) -->
<ellipse cx="80" cy="222" rx="20" ry="14" fill="#D97C4A" stroke="#3A342B" stroke-width="2"/>

<text x="210" y="305" font-family="Arial, sans-serif" font-size="20" font-weight="800" fill="#3A342B" text-anchor="middle">항정살</text>
</svg>