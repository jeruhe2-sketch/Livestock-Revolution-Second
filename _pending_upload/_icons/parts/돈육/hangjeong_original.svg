<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320">
<rect width="420" height="320" fill="#FBF8F2"/>

<!-- 몸통 -->
<ellipse cx="255" cy="200" rx="150" ry="70" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 머리 -->
<ellipse cx="95" cy="185" rx="58" ry="50" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 주둥이 -->
<ellipse cx="50" cy="195" rx="20" ry="16" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 귀 -->
<path d="M78 145 q-14 -26 12 -30 q14 16 4 34z" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 목/어깨 -->
<path d="M150 155 Q168 140 195 150 L210 230 Q170 235 150 215 Z" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
<!-- 등심(등쪽 상단 밴드) -->
<path d="M195 150 Q270 128 350 148 L350 172 Q270 155 200 172 Z" fill="#E6E1D6" stroke="#3A342B" stroke-width="2"/>
